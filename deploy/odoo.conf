[options]
; Database
db_host = db
db_port = 5432
db_user = odoo18
db_password = odoo18pwd
db_name = odoo18
db_sslmode = prefer

; Addons path — built-in + custom OCA + zakheni modules
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/account-financial-tools,/mnt/extra-addons/account-invoicing,/mnt/extra-addons/account-payment,/mnt/extra-addons/account-reconcile,/mnt/extra-addons/bank-payment,/mnt/extra-addons/bank-statement-import,/mnt/extra-addons/contract,/mnt/extra-addons/dms,/mnt/extra-addons/field-service,/mnt/extra-addons/helpdesk,/mnt/extra-addons/knowledge,/mnt/extra-addons/l10n_za_hr_payroll,/mnt/extra-addons/manufacture,/mnt/extra-addons/payroll,/mnt/extra-addons/sale-workflow,/mnt/extra-addons/sharepoint_connector,/mnt/extra-addons/stock-logistics-barcode,/mnt/extra-addons/web_timesheet,/mnt/extra-addons/zakheni_accounting,/mnt/extra-addons/zakheni_config,/mnt/extra-addons/zakheni_helpdesk,/mnt/extra-addons/zakheni_partner_enrich

; Performance
workers = 4
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120

; Security
admin_passwd = admin
list_db = True
proxy_mode = False

; Session
session_store = file

; Logging
log_level = info
log_handler = :WORKER,0,:WARNING,1
log_db = False

; Data dir
data_dir = /var/lib/odoo
